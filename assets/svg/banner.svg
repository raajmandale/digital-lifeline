<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

<rect width="1600" height="500" fill="#050816"></rect>

<defs>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00E0FF"></stop>
    <stop offset="50%" stop-color="#5B8CFF"></stop>
    <stop offset="100%" stop-color="#A855F7"></stop>
  </linearGradient>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="20" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>
</defs>

<!-- Background Grid -->
<g opacity="0.08">
  <path d="M0 50H1600" stroke="white"></path>
  <path d="M0 100H1600" stroke="white"></path>
  <path d="M0 150H1600" stroke="white"></path>
  <path d="M0 200H1600" stroke="white"></path>
  <path d="M0 250H1600" stroke="white"></path>
  <path d="M0 300H1600" stroke="white"></path>
  <path d="M0 350H1600" stroke="white"></path>
  <path d="M0 400H1600" stroke="white"></path>
  <path d="M0 450H1600" stroke="white"></path>

  <path d="M100 0V500" stroke="white"></path>
  <path d="M200 0V500" stroke="white"></path>
  <path d="M300 0V500" stroke="white"></path>
  <path d="M400 0V500" stroke="white"></path>
  <path d="M500 0V500" stroke="white"></path>
  <path d="M600 0V500" stroke="white"></path>
  <path d="M700 0V500" stroke="white"></path>
  <path d="M800 0V500" stroke="white"></path>
  <path d="M900 0V500" stroke="white"></path>
  <path d="M1000 0V500" stroke="white"></path>
  <path d="M1100 0V500" stroke="white"></path>
  <path d="M1200 0V500" stroke="white"></path>
  <path d="M1300 0V500" stroke="white"></path>
  <path d="M1400 0V500" stroke="white"></path>
  <path d="M1500 0V500" stroke="white"></path>
</g>

<!-- Reactor Rings -->
<circle cx="800" cy="250" r="140" stroke="url(#glow)" stroke-width="2" opacity="0.25"></circle>
<circle cx="800" cy="250" r="220" stroke="url(#glow)" stroke-width="1" opacity="0.18"></circle>
<circle cx="800" cy="250" r="300" stroke="url(#glow)" stroke-width="1" opacity="0.12"></circle>

<!-- Core Pulse -->
<circle cx="800" cy="250" r="12" fill="#00E0FF" filter="url(#softGlow)"></circle>

<!-- Connection Lines -->
<line x1="450" y1="250" x2="1150" y2="250" stroke="url(#glow)" stroke-width="1" opacity="0.3"></line>
<line x1="800" y1="50" x2="800" y2="450" stroke="url(#glow)" stroke-width="1" opacity="0.3"></line>

<!-- Main Title -->
<text x="800" y="185" text-anchor="middle" fill="white" font-size="54" font-family="Segoe UI, Arial" font-weight="700">
DIGITAL LIFELINE
</text>

<!-- Subtitle -->
<text x="800" y="235" text-anchor="middle" fill="#C7D2FE" font-size="22" font-family="Segoe UI, Arial">
Human-Centered Survivability Architecture
</text>

<!-- SGDS -->
<text x="800" y="270" text-anchor="middle" fill="#93C5FD" font-size="18" font-family="Segoe UI, Arial">
SGDS • Deterministic Reconstruction • Post-Failure Continuity
</text>

<!-- Bottom Statement -->
<rect x="570" y="340" rx="14" ry="14" width="460" height="48" fill="rgba(255,255,255,0.04)" stroke="url(#glow)" opacity="0.9"></rect>

<text x="800" y="372" text-anchor="middle" fill="#F8FAFC" font-size="22" font-family="Segoe UI, Arial" font-weight="600">
ATTACK ≠ PERMANENT DATA LOSS
</text>

</svg>